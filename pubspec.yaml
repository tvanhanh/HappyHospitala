name: flutter_application_datlichkham
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  url_launcher: ^6.1.14
  url_strategy: ^0.2.0
  socket_io_client: ^2.0.0
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  go_router: ^13.0.1
  flutter_riverpod: ^2.5.1
  http: ^0.13.5
  intl: ^0.18.1
  logger: ^2.0.2
  fl_chart: ^0.71.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.4
  flutter_web_plugins:
    sdk: flutter
  flutter_web3: ^2.1.0
  jwt_decoder: ^2.0.1
  path: ^1.9.0
  dotted_border: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

# Cấu hình icon nằm riêng biệt ở ngoài cùng lề trái
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  image_ratio_android: 0.7 # Thêm dòng này (giá trị từ 0.0 đến 1.0)

flutter:
  uses-material-design: true
  assets:
    - assets/
